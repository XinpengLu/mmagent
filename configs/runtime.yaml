name: mmagent
mode: train_val

benchmarks:
  - TIR-Bench

paths:
  benchmark_processed: benchmark/processed
  benchmark_split: benchmark/split
  system_prompts: prompts/system_prompts.yaml
  tool_config: configs/tool_configs.yaml

models:
  reasoning_model_name: gpt-5.5
  verifier_model_name: gpt-4o
  experience_model_name: gpt-5.5
  experience_embedding_model: text-embedding-3-small

runtime:
  enable_function_calling: true
  num_workers: 8

rollout:
  per_sample: 4
  summary_image_budget: 12
  summary_tool_images_per_rollout: 3
  max_tokens: 8192

validation:
  final_select_best: true
  reflection: true
  reflection_max_samples: 4

experience:
  large_batch: 8
  generation_workers: 2
  max_items: 90
  image_caption_workers: 4

  library:
    merge_similarity_threshold: 0.7
    reduction_similarity_threshold: 0.6
    similarity_top_k: 10
    reduction_max_rounds: 3

  retrieval:
    top_k: 3
    min_similarity: 0.0
    mmr_lambda: 0.7
    direct_max_experiences: 20

  fast_prune:
    enabled: true
    max_overflow: 12

memory:
  rerank_top_skills: 2
  rerank_top_experiences: 8

skill:
  cluster:
    max_clusters: 12
    min_experiences: 2
    similarity_threshold: 0.74

  retrieval:
    top_k: 3
    min_similarity: 0.0

failure_recovery:
  max_llm_calls: 1
  max_candidates: 1
  success_candidates: 3

api:
  openai_api_key: sk-RTh8OS_N-_Ulz16GFQTY5Q
  openai_base_url: "https://api.llm.ustc.edu.cn/v1"
  serpapi_key: 39ed7c9f34a2bc6b3bd4c0007cd6074d63355845
  jina_api_key: jina_70def61533ae4c51a69bc208606dc05domvCXdrHgUf9eyj9TtfFlc0_lUwx
  jina_proxy: "http://127.0.0.1:7890"
