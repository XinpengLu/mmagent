name: hive
mode: train_val_test

benchmarks:
  - TIR-Bench
  - VisualToolBench
  - MMSearch-Plus
  - BrowseComp-V3
  - AgentVista
  - MMBrowseComp
  - VisBrowse-Bench
  - Agentic-MME

paths:
  benchmark_processed: benchmark/processed
  benchmark_split: benchmark/split
  system_prompts: prompts/system_prompts.yaml
  tool_config: configs/tool_configs.yaml

models:
  reasoning_model_name: gpt-5.5
  verifier_model_name: qwen3.6-chat
  experience_model_name: qwen3.6-reasoner
  experience_embedding_model: text-embedding-3-small

runtime:
  enable_function_calling: true
  num_workers: 8

rollout:
  per_sample: 4
  summary_image_budget: 12
  summary_tool_images_per_rollout: 3
  max_tokens: 8192

validation:
  final_select_best: true
  reflection: true
  reflection_max_samples: 4

experience:
  large_batch: 8
  generation_workers: 2
  max_items: 90
  image_caption_workers: 4

  library:
    merge_similarity_threshold: 0.7
    reduction_similarity_threshold: 0.6
    similarity_top_k: 10
    reduction_max_rounds: 3

  retrieval:
    top_k: 3
    min_similarity: 0.0
    mmr_lambda: 0.7
    direct_max_experiences: 20

  fast_prune:
    enabled: true
    max_overflow: 12

memory:
  reuse_train_benchmark_for_test_only:
    MMBrowseComp: BrowseComp-V3
    VisBrowse-Bench: BrowseComp-V3
  rerank_top_skills: 2
  rerank_top_experiences: 8

skill:
  cluster:
    max_clusters: 12
    min_experiences: 2
    similarity_threshold: 0.75

  retrieval:
    top_k: 3
    min_similarity: 0.0

failure_recovery:
  max_llm_calls: 1
  max_candidates: 1
  success_candidates: 3

ablation:
  kind: default
  name: default
  modules:
    experience_generation: true
    experience_retrieval: true
    experience_rewrite: true
    experience_injection: true
    skill_generation: true
    skill_retrieval: true
    linked_experience_injection: true
    memory_rerank: true
    tool_plan: true
    failure_recovery: true
    validation_reflection: true

api:
  reasoning_key_file: configs/keys/huawei.keys
  reasoning_base_url: "http://115.120.87.159:8082/v1"
  verifier_key_file: configs/keys/qwen_openai.keys
  verifier_base_url: "https://api.llm.ustc.edu.cn/v1"
  experience_key_file: configs/keys/qwen_openai.keys
  experience_base_url: "https://api.llm.ustc.edu.cn/v1"
  experience_embedding_key_file: configs/keys/huawei.keys
  experience_embedding_base_url: "http://115.120.87.159:8082/v1"
  serpapi_key_file: configs/keys/serp.keys
  jina_key_file: configs/keys/jina.keys
  jina_proxy: "http://127.0.0.1:7890"

