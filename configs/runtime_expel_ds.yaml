mode: train_test

benchmarks:
  # - TIR-Bench
  # - VisualToolBench
  - MMSearch-Plus
  # - AgentVista
  # - MMBrowseComp
  # - VisBrowse-Bench
  # - Agentic-MME

paths:
  benchmark_processed: benchmark/processed
  benchmark_split: benchmark/split
  system_prompts: baseline/expel_prompts.yaml
  tool_config: configs/tool_configs.yaml

models:
  # reasoning_model_name: deepseek-v4-flash
  # verifier_model_name: deepseek-v4-flash
  reasoning_model_name: deepseek-v4-flash-ascend
  verifier_model_name: deepseek-v4-flash-ascend

baseline:
  name: expel
  code_prompt: expel_tool_code
  general_prompt: expel_tool_general
  search_prompt: expel_tool_search
  code_tools: code_interpreter
  general_tools: "web_search, visit, code_interpreter"
  search_tools: "web_search, image_search, visit, code_interpreter"
  enable_function_calling: true
  expel_train_samples: 100
  expel_max_rules: 20
  expel_train_rollouts_per_sample: 1
  expel_rule_max_tokens: 1024
  expel_rule_max_retries: 1
  reuse_train_benchmark_for_test_only:
    MMBrowseComp: BrowseComp-V3
    VisBrowse-Bench: BrowseComp-V3

runtime:
  num_workers: 4

rollout:
  per_sample: 4
  max_tokens: 8192

api:
  api_timeout_seconds: 180
  api_max_retries: 2
  # reasoning_key_file: configs/keys/openai2.keys
  # reasoning_base_url: "https://card.nassaapi.xyz/v1"
  reasoning_key_file: configs/keys/qwen_openai4.keys
  reasoning_base_url: "https://api.llm.ustc.edu.cn/v1"
  verifier_key_file: configs/keys/qwen_openai4.keys
  verifier_base_url: "https://api.llm.ustc.edu.cn/v1"
  serpapi_key_file: configs/keys/serp.keys
  jina_key_file: configs/keys/jina.keys
  jina_proxy: "http://127.0.0.1:7890"

