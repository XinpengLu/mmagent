mode: test

benchmarks:
  - TIR-Bench
  - VisualToolBench
  - MMSearch-Plus
  - BrowseComp-V3
  - AgentVista
  - MMBrowseComp
  - VisBrowse-Bench
  - Agentic-MME

paths:
  benchmark_processed: benchmark/processed
  benchmark_split: benchmark/split
  system_prompts: baseline/prompts.yaml
  tool_config: configs/tool_configs.yaml

models:
  reasoning_model_name: deepseek-v4-flash
  verifier_model_name: deepseek-v4-flash

baseline:
  name: no_tool
  system_prompt: no_tool_direct_cot
  enabled_tools: ""
  enable_function_calling: false

runtime:
  num_workers: 20

rollout:
  per_sample: 4
  max_tokens: 8192

api:
  reasoning_key_file: configs/keys/openai.keys
  reasoning_base_url: "https://card.nassaapi.xyz/v1"
  verifier_key_file: configs/keys/openai.keys
  verifier_base_url: "https://card.nassaapi.xyz/v1"

